<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#faf9f5" />
  <!-- 48px grid lines -->
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="rgba(10,10,10,0.06)" stroke-width="1" />
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Main Card -->
  <rect x="80" y="80" width="1040" height="470" fill="#ffffff" stroke="#0a0a0a" stroke-width="6" />
  <rect x="88" y="88" width="1040" height="470" fill="none" stroke="#0a0a0a" stroke-width="0" />

  <!-- Header bar -->
  <rect x="80" y="80" width="1040" height="64" fill="#0a0a0a" />
  <circle cx="120" cy="112" r="8" fill="#ff2d75" stroke="#000000" stroke-width="2" />
  <circle cx="144" cy="112" r="8" fill="#ccff00" stroke="#000000" stroke-width="2" />
  <circle cx="168" cy="112" r="8" fill="#00c2ff" stroke="#000000" stroke-width="2" />
  <text x="600" y="118" fill="#ffffff" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle" letter-spacing="3">
    PASYA ZAHRI // AUDIO ENGINE PORTFOLIO // VER 4.8
  </text>
  <rect x="1000" y="96" width="90" height="32" fill="#ccff00" stroke="#0a0a0a" stroke-width="2" />
  <text x="1045" y="117" fill="#0a0a0a" font-family="monospace" font-size="12" font-weight="900" text-anchor="middle">
    LIVE
  </text>

  <!-- Title & Subtitle -->
  <text x="130" y="240" fill="#0a0a0a" font-family="'Impact', sans-serif" font-size="76" font-weight="900" letter-spacing="-1">
    PASYA ZAHRI
  </text>

  <rect x="130" y="270" width="700" height="58" fill="#0a0a0a" stroke="#0a0a0a" stroke-width="3" />
  <text x="150" y="310" fill="#ccff00" font-family="'Impact', sans-serif" font-size="40" font-weight="900" letter-spacing="2">
    FULL-STACK &amp; MOBILE DEVELOPER.
  </text>

  <text x="130" y="370" fill="#4d7c0f" font-family="monospace" font-size="16" font-weight="bold" letter-spacing="2">
    // JAKARTA NODE &bull; REACT 19 &bull; DISTRIBUTED RUNTIMES &bull; DSP ENGINES
  </text>

  <text x="130" y="420" fill="#333333" font-family="sans-serif" font-size="20" width="800">
    Resilient web and mobile digital products with audio engine aesthetics and mathematical precision.
  </text>

  <!-- Four point star -->
  <polygon points="1030,220 1045,260 1085,275 1045,290 1030,330 1015,290 975,275 1015,260" fill="#ccff00" stroke="#0a0a0a" stroke-width="3" />
</svg>
